name: Offline Player Debug Build

on:
  push:
    branches: [offline-only]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-offline-debug
          path: app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
